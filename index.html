<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S.W.E.E.T. TEAms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="title-bar">
  <h1>S.W.E.E.T. TEAms</h1>
  <h2>Making Our Youth as S.W.E.E.T. as Our Tea</h2>
</div>

  <!-- Age Level -->
  <label>Age Level:</label>
  <select id="ageLevel">
    <option value="middle">Middle School (6–8)</option>
    <option value="high">High School (9–12)</option>
  </select>

  <!-- Category -->
  <label>Category:</label>
  <select id="category" onchange="handleCategoryChange()">
    <option value="">-- Select Category --</option>
    <option value="selfEsteem">Self Esteem</option>
    <option value="wellBalanced">Well-Balanced</option>
    <option value="empathetic">Empathetic</option>
    <option value="empowered">Empowered</option>
    <option value="teamPlayer">Team Player</option>
    <option value="gettingToKnowMe">Getting to Know Me</option>
    <option value="competitive">Competitive – How Well Do You Know Me?</option>
  </select>

  <!-- Number Input -->
  <label>Ball Number (1–25):</label>
  <input type="number" id="numberInput" min="1" max="25">

  <button onclick="getQuestion()">Get Question</button>

  <!-- Question Display -->
  <div id="questionBox"></div>

  <!-- Competitive Section -->
  <div id="competitiveSection" style="display:none;">
    <h3>Team Scores</h3>

    <p>Team A: <span id="teamAScore">0</span></p>
    <p>Team B: <span id="teamBScore">0</span></p>

    <button onclick="addPoint('A')">+1 Team A</button>
    <button onclick="addPoint('B')">+1 Team B</button>
    <button onclick="resetScores()">Reset Scores</button>
  </div>

  <footer>
    © 2025 S.W.E.E.T. TEAms. All rights reserved.
  </footer>

  <script src="script.js"></script>
</body>
</html>
