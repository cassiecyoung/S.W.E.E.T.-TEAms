    // Each number (1–25) maps to a fixed question
    // Same number = same question every time

    function generateQuestion() {
      const category = document.getElementById('category').value;
      const age = document.getElementById('age').value;
      let num = document.getElementById('manualNumber').value;

      // If no number entered, generate one
      if (!num || num < 1 || num > 25) {
        num = Math.floor(Math.random() * 25) + 1;
      }

      const qList = questions[category][age];

      // Map number directly to question index (1 → index 0, 25 → index 24)
      const question = qList[num - 1];

      document.getElementById('number').innerText = num;
      document.getElementById('question').innerText = question;
      document.getElementById('questionBox').style.display = 'block';

      document.getElementById('counter').innerText =
        `Question ${num} of 25 for this category`;
    }
